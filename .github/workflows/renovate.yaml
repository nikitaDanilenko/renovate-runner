name: Renovate

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract Repositories from config.js
        id: repos
        run: |
          list=$(node -e "const c = require('./config.js'); console.log(c.repositories.map(r => r.split('/')[1]).join(','));")
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_BOT_PRIVATE_KEY }}
          owner: nikitaDanilenko
          repositories: ${{ steps.repos.outputs.list }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-vulnerability-alerts: read

      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        env:
          LOG_LEVEL: 'info'
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: 'false'
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: config.js
